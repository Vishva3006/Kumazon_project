services:
  - type: web
    name: kumazon
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /opt/render/project/src/data
    disk:
      name: kumazon-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
