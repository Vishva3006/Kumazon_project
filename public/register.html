<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<title>Create an account: Bench Supply</title>
</head>
<body>
<header id="site-header"></header>

<main class="page page--narrow">
  <h1>Create an account</h1>
  <p class="lede">Save your details and track your orders.</p>
  <form class="form" id="form" novalidate>
    <div class="field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required></div>
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required><div class="hint">At least 8 characters.</div></div>
    <p class="msg" id="error" role="alert" hidden></p>
    <button class="btn" type="submit" id="submit">Create account</button>
  </form>
  <p class="switch">Already have an account? <a href="/login.html" id="switch">Log in</a></p>
</main>

<script src="/js/app.js"></script>
<script>
(async function () {
  const user = await initPage();
  if (user) { location.href = safeNext(); return; }

  // Keep the "next" target when switching between log in and sign up.
  const next = new URLSearchParams(location.search).get('next');
  if (next) document.getElementById('switch').href += '?next=' + encodeURIComponent(next);

  const form = document.getElementById('form');
  const errorBox = document.getElementById('error');
  const btn = document.getElementById('submit');

  form.addEventListener('submit', async e => {
    e.preventDefault();
    errorBox.hidden = true;
    btn.disabled = true;
    const f = new FormData(form);
    try {
      await api('/api/auth/register', { method: 'POST', body: { name: f.get('name'), email: f.get('email'), password: f.get('password') } });
      location.href = safeNext();
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.hidden = false;
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
